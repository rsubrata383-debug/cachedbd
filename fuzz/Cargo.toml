[package]
name = "cachedb-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
skiffdb = { path = ".." }

[[bin]]
name = "decode_frame"
path = "fuzz_targets/decode_frame.rs"
test = false
doc = false

[[bin]]
name = "decode_value"
path = "fuzz_targets/decode_value.rs"
test = false
doc = false

[[bin]]
name = "split_stream"
path = "fuzz_targets/split_stream.rs"
test = false
doc = false

[workspace]
