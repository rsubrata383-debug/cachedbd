name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Build, Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Run property tests
        run: cargo test --test property

      - name: Run store benchmark smoke test
        run: cargo bench --bench store_bench -- --smoke

      - name: Build documentation
        run: cargo doc --no-deps

  soak:
    name: Real 10k connection test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run 10k real TCP soak test
        run: |
          ulimit -Hn
          ulimit -n 30000
          ulimit -n
          # Ignored tests run in parallel by default and share the process file descriptor limit.
          # Run with --test-threads=1 so each 10k connection test executes sequentially.
          cargo test --release --test soak -- --ignored --nocapture --test-threads=1

  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [decode_frame, decode_value, split_stream]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run fuzz smoke test
        run: |
          # Quick smoke test (60s per target) to catch immediate regressions in CI
          # without burning runner minutes; full fuzz campaigns run out-of-band.
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 -rss_limit_mb=2048

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts

  sanitizer:
    # src/net/sys.rs has unsafe epoll code; AddressSanitizer catches memory errors
    # there and in the protocol code.
    name: AddressSanitizer (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run tests under AddressSanitizer
        run: |
          # Do NOT run the ignored 10k soak tests under the sanitizer:
          # too many sockets and too much memory for ASan, and they already run in the "soak" job.
          RUSTFLAGS="-Zsanitizer=address" RUSTDOCFLAGS="-Zsanitizer=address" cargo test --target x86_64-unknown-linux-gnu --lib --tests
